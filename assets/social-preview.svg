  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g transform="translate(120 152) scale(0.675)">
    <g fill="none" stroke="url(#wave)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 160 Q136 104 176 160 T256 160 T336 160 T416 160" opacity="1"/>
